name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q paper-download/scripts
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          text = Path('paper-download/SKILL.md').read_text()
          data = yaml.safe_load(text.split('---', 2)[1])
          assert data['name'] == 'paper-download'
          assert data['description'].strip()
          assert '[TODO' not in text
          interface = yaml.safe_load(Path('paper-download/agents/openai.yaml').read_text())['interface']
          assert '$paper-download' in interface['default_prompt']
          PY
